<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOW.gg — Gerenciamento de Jogos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-content">
      <div class="brand">
        <span class="brand-badge">NOW</span>
        <div>
          <h1>NOW.gg</h1>
          <p>Gerenciamento de Catálogo • Cloud Firestore</p>
        </div>
      </div>
      <div class="status-pill" id="connectionStatus">Conectando...</div>
    </div>
  </header>

  <main class="container layout">
    <!-- Formulário de Cadastro / Edição -->
    <section class="card form-section">
      <h2 id="formTitle">Cadastrar Novo Jogo</h2>

      <form id="gameForm">
        <input type="hidden" id="gameId" />

        <div class="field">
          <label for="titulo">Título do Jogo *</label>
          <input type="text" id="titulo" placeholder="Ex: Hollow Knight" required />
        </div>

        <div class="field">
          <label for="desenvolvedora">Desenvolvedora *</label>
          <input type="text" id="desenvolvedora" placeholder="Ex: Team Cherry" required />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="genero">Gênero *</label>
            <select id="genero" required>
              <option value="">Selecione...</option>
              <option value="Ação">Ação</option>
              <option value="Aventura">Aventura</option>
              <option value="RPG">RPG</option>
              <option value="Estratégia">Estratégia</option>
              <option value="Esportes">Esportes</option>
              <option value="Corrida">Corrida</option>
              <option value="Casual">Casual</option>
            </select>
          </div>

          <div class="field">
            <label for="classificacao">Classificação *</label>
            <select id="classificacao" required>
              <option value="">Selecione...</option>
              <option value="Livre">Livre</option>
              <option value="10+">10+</option>
              <option value="12+">12+</option>
              <option value="14+">14+</option>
              <option value="16+">16+</option>
              <option value="18+">18+</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="avaliacao">Avaliação (0 a 5) *</label>
            <input type="number" id="avaliacao" min="0" max="5" step="0.1" placeholder="Ex: 4.8" required />
          </div>

          <div class="field">
            <label for="tempo_sessao">Sessão Média (min) *</label>
            <input type="number" id="tempo_sessao" min="1" step="1" placeholder="Ex: 30" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Cadastrar Jogo</button>
          <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Cancelar Edição</button>
        </div>
      </form>
    </section>

    <!-- Listagem e Busca -->
    <section class="list-section">
      <div class="list-header">
        <div>
          <h2>Jogos Cadastrados</h2>
          <span class="counter" id="gamesCount">0 jogos</span>
        </div>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por título ou gênero..."
            autocomplete="off"
          />
        </div>
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div id="loadingState" class="empty-state">
        Carregando jogos do Firebase...
      </div>

      <div id="emptyState" class="empty-state hidden">
        Nenhum jogo encontrado. Cadastre o primeiro ao lado!
      </div>

      <div id="gamesList" class="games-grid"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
